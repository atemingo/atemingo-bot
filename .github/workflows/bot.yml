name: atemingo-bot

on:
  schedule:
    # Her saat başı: iş 6 saatte bir zaman aşımına uğrar, saatlik tetik
    # yeni koşuyu hemen başlatıp eskisini iptal eder — boşluk kalmaz.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: atemingo-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: bot
        env:
          BOT_TOKENS: ${{ secrets.BOT_TOKENS }}
          GH_STATE_REPO: ${{ github.repository }}
          GH_STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          GH_STATE_BRANCH: state
          GH_STATE_FILE: state.json
          CREDITS_KEY: ${{ secrets.CREDITS_KEY }}
        run: node src/index.js

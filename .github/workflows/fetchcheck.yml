name: fetchcheck
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node -e "
          const urls=['https://atemingo.github.io/AtemingoLauncher/updates/version.json','https://raw.githubusercontent.com/atemingo/AtemingoLauncher/main/updates/version.json'];
          (async()=>{for(const u of urls){const t=Date.now();try{const r=await fetch(u,{signal:AbortSignal.timeout(8000)});const j=await r.json();console.log(u,r.status,j.version,Date.now()-t+'ms');}catch(e){console.log(u,'FAIL',e.name,e.message,Date.now()-t+'ms');}}})();
          "

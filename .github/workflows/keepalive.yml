name: atemingo-bot-keepalive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: bot kosusu var mi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(gh run list --workflow bot.yml --limit 10 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="requested" or .status=="pending" or .status=="waiting")] | length')
          echo "aktif kosu: $active"
          if [ "$active" = "0" ]; then
            gh workflow run bot.yml --ref main
            echo "bot yeniden tetiklendi"
          else
            echo "bot zaten calisiyor"
          fi
